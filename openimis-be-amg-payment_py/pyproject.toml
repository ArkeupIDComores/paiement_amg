[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openimis_be_amg_payment"
version = "0.1.1"
description = "openIMIS Backend module for AMG payment via HOLO/TagPay"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AMG Dev", email = "dev@amg.km" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Django",
]

[tool.setuptools.packages.find]
# Inclure le module principal et l'app 'payments' embarquée
include = ["amg_payment*", "payments*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Inclure templates et statiques de l'app payments dans le wheel
payments = [
  "templates/**/*",
  "static/**/*",
]